
services:
  # ตั้งชื่อ Service 
  web-app:
    # Docker Compose ทำการ Build Image จาก Dockerfile ในโฟลเดอร์ปัจจุบัน (.)
    build: .


    image: my-compose-app:latest
    

    container_name: my-compose-container
    
    # พอร์ตเครื่องคอม : พอร์ตในกล่อง Docker
    ports:
      - "3000:3000"

    volumes:
      - .:/usr/src/app                   

    command: sh -c "bun install && bun --watch run dev"